# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: school-db
    plan: free
    databaseName: school_db
    user: school_user

services:
  - type: web
    name: school-management-system
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
