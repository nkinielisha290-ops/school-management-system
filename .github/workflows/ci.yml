name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: school_db
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: school_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_user -d school_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://school_user:school_pass@localhost:5432/school_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Run tests
        run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t school-management-system .
